<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RX Toolhead V5.5 Configurator</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#eef3f8;font-family:Inter,system-ui,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:url('./assets/background.png') center/cover no-repeat;opacity:.055;filter:blur(2px);z-index:-2}body:after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(6,9,14,.97),rgba(6,9,14,.88) 45%,rgba(6,9,14,.93));z-index:-1}.app{display:grid;grid-template-columns:430px 1fr;min-height:100vh}.side{padding:26px;border-right:1px solid #26303a;background:#0b1016cc;overflow:auto;max-height:100vh}.brand{font-weight:900;font-size:24px;letter-spacing:.5px}.brand b{color:#46c9ff}.sub{color:#91a0ae;font-size:13px;margin:5px 0 22px}.progress{height:5px;background:#202832;border-radius:9px;overflow:hidden;margin-bottom:22px}.progress i{display:block;height:100%;width:7%;background:#46c9ff}.cat{border:1px solid #26313c;background:#0d131a;border-radius:13px;margin:10px 0;overflow:hidden}.cat h3{font-size:13px;margin:0;padding:13px 14px;color:#c9d5df;border-bottom:1px solid #202a34}.opts{padding:8px}.opt{display:block;padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer}.opt:hover{background:#151e27}.opt input{accent-color:#46c9ff;margin-right:8px}.recommended{color:#78e5a0;font-size:10px;margin-left:5px}.universal{border-color:#2b9b70}.universal h3{color:#7de4b3}.main{position:relative;display:flex;flex-direction:column}.top{padding:24px 28px;display:flex;justify-content:space-between;align-items:center}.badge{font-size:12px;color:#8d9aa7}.viewer{flex:1;min-height:520px;position:relative}.viewer canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:28px;bottom:25px;background:#0b1119d9;border:1px solid #26323d;padding:10px 13px;border-radius:10px;color:#9daab5;font-size:12px}.summary{position:absolute;right:24px;top:78px;width:250px;background:#0a1018e8;border:1px solid #293541;border-radius:13px;padding:14px}.summary h4{margin:0 0 9px}.summary div{font-size:11px;color:#aebac4;margin:4px 0}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid #34414d;background:#151d26;color:white;padding:9px 11px;border-radius:9px;cursor:pointer}.primary{background:#168fbd;border-color:#2ab7ec}@media(max-width:900px){.app{grid-template-columns:1fr}.side{max-height:none}.main{min-height:70vh}.summary{display:none}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div class="app"><aside class="side"><div class="brand"><b>RX</b> Toolhead V5.5</div><div class="sub">Build your toolhead • choose parts • preview • download</div><div class="progress"><i id="bar"></i></div><div id="wizard"></div></aside><main class="main"><div class="top"><div><b>Interactive Build Preview</b><div class="badge" id="status">Loading universal parts…</div></div><button class="btn" id="fit">Fit View</button></div><div class="viewer" id="viewer"><div class="hint">Drag to rotate · Scroll to zoom · Your selected GLB parts appear here</div></div><div class="summary"><h4>Your Build</h4><div id="sum"></div><div class="actions"><button class="btn">Individual STLs</button><button class="btn primary">Build Pack</button></div></div></main></div>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const cats=[
['Carriage',['Voron MGN12 — 6/9 mm Belt','Monolith MGN12 — 6/9 mm Belt','SV08 MGN12 — 6/9 mm Belt','MGN9 Linear Rails Front Mount']],
['Main Body',['Single-Print Body','Hybrid Body — Printed + Machined Parts']],
['Heating Assembly',['H2D Right Side (Recommended)','A1','H2D Left Side','Old-Style Bambu Lab X1C Hotend']],
['Hotend',['A1','H2D Standard Flow — 48 mm³/s','H2D High Flow — 65 mm³/s','Printed Mount — Old-Style Bambu Lab X1C Hotend']],
['Extruder',['H2S','A1']],['Sensor Mount',['OZN Lab Sensor','No Sensor']],
['Probe',['BTT Eddy','Beacon','Cartographer','Mellow FLY Eddy','BIQU MicroProbe']],
['Toolhead Board',['EBB36 V1.2','EBB36 Gen 2','Mellow STH36','Nighthawk-36']],['Part Cooling',['5015','CPAP']],
['Filament Sensor',['Single Filament Sensor','Dual Filament Sensor Sync']],
['Cable Connector',['Umbilical PG7 Mount','Umbilical XT30 Mount','XT30 + Drag Chain Mount']],
['Front Cover',['Single-Color Print + Glue','AMS Dual-Color Print']],
['Filament Depressor (Optional)',['None','Static Gantry Left','Static Gantry Right','Servo Motorized Open/Close']],
['Pen Plotter Module',['No','Yes']]];
const wiz=document.querySelector('#wizard'); const selected={};
let html='<section class="cat universal"><h3>✓ Common Parts — UNIVERSAL</h3><div class="opts"><label class="opt"><input type="checkbox" checked disabled>Always included in every build</label></div></section>';
cats.forEach((c,ci)=>{selected[c[0]]=c[1][0];html+=`<section class="cat"><h3>${ci+1}. ${c[0]}</h3><div class="opts">`+c[1].map((o,i)=>`<label class="opt"><input type="radio" name="c${ci}" value="${o}" ${i===0?'checked':''}>${o}${o.includes('Recommended')?'<span class="recommended">RECOMMENDED</span>':''}</label>`).join('')+'</div></section>'});wiz.innerHTML=html;
function update(){document.querySelector('#sum').innerHTML=Object.entries(selected).map(([k,v])=>`<div><b>${k}:</b> ${v}</div>`).join(''); document.querySelector('#bar').style.width=(Object.keys(selected).length/cats.length*100)+'%'}
wiz.addEventListener('change',e=>{if(e.target.type==='radio'){selected[cats[+e.target.name.slice(1)][0]]=e.target.value;update()}});update();
const host=document.querySelector('#viewer'),scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(35,1,.1,5000);camera.position.set(160,120,180);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x263241,2.2));const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(80,120,100);scene.add(dl);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const root=new THREE.Group();scene.add(root);const loader=new GLTFLoader();
const universal=['Back Electronics Housing.glb','Front Cover Clips.glb','Logo - Transparent Print.glb','Part Cooling Duct.glb','RX-H2S&A1 Gear toolhead 5015 V5.5 7.glb','RX-H2S&A1 Gear toolhead 5015 V5.5.2 3.glb'].map(x=>'./assets/glb/Common Parts - UNIVERSAL/'+x);
let pending=universal.length;universal.forEach(u=>loader.load(u,g=>{root.add(g.scene);if(--pending===0){fit();document.querySelector('#status').textContent='Universal parts loaded • configuration assets ready'}},undefined,()=>{if(--pending===0)fit()}));
function fit(){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());controls.target.copy(c);const m=Math.max(s.x,s.y,s.z);camera.position.copy(c).add(new THREE.Vector3(m*1.4,m*.9,m*1.4));camera.near=m/100;camera.far=m*20;camera.updateProjectionMatrix();controls.update()}document.querySelector('#fit').onclick=fit;
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();(function a(){requestAnimationFrame(a);controls.update();renderer.render(scene,camera)})();
</script></body></html>
